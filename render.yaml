services:
  - type: web
    name: student-performance
    runtime: python
    plan: free
    rootDir: student-performance-system
    buildCommand: pip install -r requirements.txt && python ml-service/train_model.py
    startCommand: gunicorn --chdir backend --bind 0.0.0.0:$PORT --workers 2 --timeout 120 wsgi:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PORT
        value: 10000
      - key: FLASK_DEBUG
        value: "0"
