<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History · SPS Student</title>
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><img class="logo-img" src="../assets/images/logo.svg" alt="SPS logo"><div><strong>SPS Student</strong><small>Learning Portal</small></div></div>
    <nav class="nav">
      <div class="nav-label">Learn</div>
      <a href="dashboard.html" data-page="dashboard.html"><span class="ico">📊</span> Dashboard</a>
      <a href="prediction.html" data-page="prediction.html"><span class="ico">🔮</span> New Prediction</a>
      <a href="my-marks.html" data-page="my-marks.html"><span class="ico">📝</span> My Marks</a>
      <a href="recommendations.html" data-page="recommendations.html"><span class="ico">🎯</span> Recommendations</a>
      <div class="nav-label">Me</div>
      <a href="study-habits.html" data-page="study-habits.html"><span class="ico">📚</span> Study Habits</a>
      <a href="history.html" data-page="history.html"><span class="ico">🕘</span> History</a>
      <a href="profile.html" data-page="profile.html"><span class="ico">👤</span> Profile</a>
      <div class="nav-label">System</div>
      <a href="../index.html"><span class="ico">🏠</span> View Site</a>
      <a href="#" data-logout><span class="ico">🚪</span> Logout</a>
    </nav>
    <div class="side-foot">© <span id="year"></span> SPS · v1.0</div>
  </aside>
  <div class="main-area">
    <div class="topbar"><button class="ghost sm menu-btn" id="menuBtn">☰</button><span class="title">Prediction History</span><span class="spacer"></span><span class="badge info" id="srcBadge">…</span><div class="user-chip"><span class="avatar">S</span><span data-username>Student</span></div></div>
    <div class="content">
      <div class="page-head"><div><h1>History 🕘 <span class="badge info" id="countBadge">0</span></h1><p>Every prediction you've run, newest first.</p></div>
        <div class="toolbar"><button class="ghost" id="exportBtn">⬇ Export CSV</button><button onclick="location.href='prediction.html'">+ New Prediction</button></div></div>
      <div class="card mb-2"><div class="toolbar"><div class="search"><input id="q" placeholder="Search history…"></div>
        <select id="levelFilter" style="max-width:190px"><option value="">All levels</option><option>Excellent</option><option>Good</option><option>Average</option><option>Needs Improvement</option></select></div></div>
      <div class="table-wrap"><table><thead><tr><th>#</th><th>Grade</th><th>Level</th><th>Top Tip</th><th>When</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody></table></div>
    </div>
  </div>
</div>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/guard.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/charts.js"></script>
<script src="../js/student.js"></script>
<script>
Student.seedDemo();
requireRole(["student"]);
let DATA = [];
function render() {
  const q = document.getElementById("q").value.toLowerCase(), lf = document.getElementById("levelFilter").value;
  const list = DATA.filter(r => (!lf || r.performance_level === lf) && (!q || JSON.stringify(r).toLowerCase().includes(q)));
  document.getElementById("countBadge").textContent = DATA.length;
  document.getElementById("rows").innerHTML = list.length ? list.map(r => {
    const recs = Array.isArray(r.recommendations) ? r.recommendations : [];
    const top = recs[0] ? (typeof recs[0] === "string" ? recs[0] : (recs[0].title || recs[0].topic || "")) : "—";
    return `<tr><td class="muted">#${r.id}</td><td><b>${r.predicted_grade}</b> / 20</td><td>${levelBadge(r.performance_level)}</td>
      <td style="max-width:280px">${escapeHtml(String(top).slice(0, 100))}</td><td class="muted">${fmtDate(r.created_at)}</td></tr>`;
  }).join("") : `<tr><td colspan="5" class="empty">${DATA.length ? "No matching records." : 'No history yet. <a href="prediction.html">Run a prediction →</a>'}</td></tr>`;
}
document.addEventListener("DOMContentLoaded", async () => {
  Student.bindShell();
  try {
    DATA = await getHistory();
  } catch { DATA = []; }
  const live = DATA.length > 0;
  document.getElementById("srcBadge").textContent = live ? "● live backend" : "○ offline";
  document.getElementById("srcBadge").className = "badge " + (live ? "ok" : "neutral");
  render();
  document.getElementById("q").addEventListener("input", render);
  document.getElementById("levelFilter").addEventListener("input", render);
  document.getElementById("exportBtn").onclick = () => downloadCSV("my-history.csv", DATA.map(r => ({ id: r.id, grade: r.predicted_grade, level: r.performance_level, created_at: r.created_at })));
});
</script>
</body>
</html>
